<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Circle Background -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>
  
  <!-- Android Robot Style Icon -->
  <g transform="translate(100, 100)">
    <!-- Phone/Device Shape -->
    <rect x="-35" y="-45" width="70" height="90" rx="8" fill="white" opacity="0.95"/>
    
    <!-- Screen -->
    <rect x="-28" y="-35" width="56" height="60" rx="4" fill="url(#grad2)"/>
    
    <!-- Download Arrow -->
    <g transform="translate(0, -5)">
      <line x1="0" y1="-15" x2="0" y2="15" stroke="white" stroke-width="5" stroke-linecap="round"/>
      <polyline points="-10,5 0,15 10,5" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    
    <!-- Bottom Button -->
    <circle cx="0" cy="35" r="4" fill="#06b6d4"/>
  </g>
  
  <!-- Letter D -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">D</text>
</svg>
